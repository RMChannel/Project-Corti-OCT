<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controller - Dual Presenter</title>
    <link rel="stylesheet" href="./controller.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Dual Screen Controller</h1>
        <div id="presenterStatus" class="status status-idle">Presenter: in attesa</div>
      </header>

      <section class="grid">
        <article class="card">
          <h2>Anteprima</h2>
          <div class="preview-stage mode-blackout" id="previewStage">
            <section id="previewTextSlide" class="text-slide hidden">
              <h1 id="previewTitle"></h1>
              <p id="previewDescription"></p>
            </section>
            <video id="previewVideoEl" class="video hidden" muted preload="auto" playsinline></video>
          </div>
        </article>
        <article class="card">
          <h2>Gestione Testi</h2>
          <label class="field">
            <span>Preset Titolo/Squadra</span>
            <select id="presetSelect">
              <option value="">Selezione manuale</option>
            </select>
          </label>
          <label class="field">
            <span>Titolo</span>
            <input id="titleInput" type="text" placeholder="Inserisci il titolo" />
          </label>
          <label class="field">
            <span>Descrizione</span>
            <textarea id="descriptionInput" rows="5" placeholder="Inserisci la descrizione"></textarea>
          </label>
          <button id="showTextBtn" class="btn btn-primary">Mostra Titolo e Descrizione</button>
        </article>

        <article class="card">
          <h2>Selezione Video</h2>
          <div class="row">
            <button id="refreshVideosBtn" class="btn">Aggiorna elenco da Corti</button>
            <span id="folderLabel" class="hint">Cartella: Corti</span>
          </div>
          <label class="field">
            <span>Video disponibili</span>
            <select id="videoSelect">
              <option value="">Nessun video disponibile</option>
            </select>
          </label>
          <div class="actions">
            <button id="loadVideoBtn" class="btn btn-primary" disabled>Carica Video</button>
          </div>
          <div class="video-controls">
            <div class="timeline-container">
              <input type="range" id="videoTimeline" min="0" max="100" value="0" step="0.1" disabled />
              <div class="time-display">
                <span id="currentTimeDisplay">00:00</span> / <span id="durationDisplay">00:00</span>
              </div>
            </div>
            <div class="playback-actions">
              <button id="playBtn" class="btn btn-success" disabled>Play</button>
              <button id="pauseBtn" class="btn btn-warning" disabled>Pausa</button>
              <button id="resetBtn" class="btn btn-secondary" disabled>Reset</button>
            </div>
          </div>
        </article>

        <article class="card card-blackout">
          <h2>Emergenza</h2>
          <p class="hint">Svuota lo schermo presenter e mette in pausa il video.</p>
          <button id="blackoutBtn" class="btn btn-danger">Slide Vuota (Blackout)</button>
        </article>

        <article class="card card-wide">
          <div class="row row-between">
            <h2>Esclusi</h2>
            <button id="restoreExcludedBtn" class="btn" disabled>Ripristina esclusi</button>
          </div>
          <p id="excludedCount" class="hint">Nessun elemento escluso</p>
          <ul id="excludedList" class="excluded-list"></ul>
          <label class="field">
            <span>JSON esclusi</span>
            <pre id="excludedJson" class="json-box">[]</pre>
          </label>
        </article>
      </section>
    </main>

    <script src="./controller.js"></script>
  </body>
</html>
